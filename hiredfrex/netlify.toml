# HiredFrex — static app + serverless API + server-rendered public pages
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API
# Ezoic ads.txt manager — redirects to Ezoic's managed file which includes
# Google AdSense and all other authorized partners, updated automatically.
[[redirects]]
  from = "/ads.txt"
  to = "https://srv.adstxtmanager.com/19390/hiredfrex.com"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200


# Server-rendered, crawlable public pages
[[redirects]]
  from = "/sitemap"
  to = "/.netlify/functions/pages/sitemap"
  status = 200

