<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #10243F;
    }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      background:
        radial-gradient(ellipse 78% 68% at 50% 46%, #1a3658 0%, #10243F 58%, #0b1a30 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.055;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 180px 180px;
    }
    .lockup {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-6px);
    }
    .wordmark {
      width: 740px;
      height: auto;
      display: block;
    }
    .rule {
      width: 72px;
      height: 2px;
      margin: 28px 0 22px;
      background: #9A6B1F;
      border-radius: 1px;
    }
    .tagline {
      font-family: "Source Sans 3", "Liberation Sans", "Segoe UI", sans-serif;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.055em;
      color: #F7F3EA;
      line-height: 1;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="grain"></div>
    <div class="lockup">
      <img class="wordmark" id="wordmark" alt="HiredFrex" />
      <div class="rule"></div>
      <p class="tagline">Career guides. Honest job listings.</p>
    </div>
  </div>
</body>
</html>
